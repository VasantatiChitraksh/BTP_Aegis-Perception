run:
  name: rain_restormer_seed42
  seed: 42
  device: cuda
  output_dir: artifacts/restoration/rain_restormer_seed42

data:
  manifest: data/manifests/realrain1k.csv
  image_size: [128, 128]
  train_mode: crop
  eval_mode: native
  random_crop: true
  random_flip: true
  num_workers: 4

model:
  name: restormer
  dim: 48
  num_blocks: [4, 6, 6, 8]
  num_refinement_blocks: 4
  heads: [1, 2, 4, 8]
  ffn_expansion_factor: 2.66
  bias: false
  layer_norm_type: WithBias
  pretrained: artifacts/pretrained/deraining.pth

train:
  epochs: 20
  batch_size: 4
  optimizer: adamw
  learning_rate: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001
  scheduler: cosine
  min_learning_rate: 0.000001
  precision: bf16
  grad_clip: 1.0
  gan_weight: 0.0
  l1_weight: 1.0
  checkpoint_every: 5
