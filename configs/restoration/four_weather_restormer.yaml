run:
  name: four_weather_restormer_seed42
  seed: 42
  device: cuda
  output_dir: artifacts/restoration/four_weather_restormer_seed42

data:
  manifest: data/manifests/clean/four_weather.csv
  image_size: [256, 256]
  train_mode: crop
  eval_mode: native
  random_crop: true
  random_flip: true
  num_workers: 4
  # Each weather probability is shared uniformly across scenes, then variants.
  weather_probabilities: {rain: 0.30, fog: 0.30, snow: 0.30, smoke: 0.10}
  samples_per_epoch: 4096

model:
  name: restormer
  dim: 48
  num_blocks: [4, 6, 6, 8]
  heads: [1, 2, 4, 8]
  num_refinement_blocks: 4
  ffn_expansion_factor: 2.66
  bias: false
  layer_norm_type: WithBias
  # Fresh official initialization, not the rain checkpoint trained on leaked pairs.
  pretrained: artifacts/pretrained/deraining.pth

train:
  epochs: 60
  batch_size: 4
  optimizer: adamw
  learning_rate: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001
  scheduler: cosine
  min_learning_rate: 0.000001
  precision: bf16
  grad_clip: 1.0
  gan_weight: 0.0
  l1_weight: 1.0
  checkpoint_every: 10
  selection_metric: macro_scene_psnr_db
