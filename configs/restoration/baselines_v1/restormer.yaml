# Same official pretrained initialization as the successful 60-epoch Restormer run.
run:
  name: restormer_seed42
  seed: 42
  device: cuda
  output_dir: artifacts/restoration/baselines_v1/restormer_seed42
  deterministic: true
data:
  manifest: data/manifests/weather_v3/active.csv
  image_size:
  - 256
  - 256
  train_mode: crop
  eval_mode: native
  random_crop: true
  random_flip: true
  num_workers: 2
  weather_probabilities:
    rain: 0.3
    fog: 0.3
    snow: 0.3
    smoke: 0.1
  samples_per_epoch: 4096
  sampling: weighted_seeded
  protocol: data/manifests/weather_v3/protocol.json
  protocol_sha256: 0fca0d9c2849b731c4281e6528ff473dc606ca6d01773c6d8ef8d9ed56a17886
model:
  name: restormer
  dim: 48
  num_blocks:
  - 4
  - 6
  - 6
  - 8
  heads:
  - 1
  - 2
  - 4
  - 8
  num_refinement_blocks: 4
  ffn_expansion_factor: 2.66
  bias: false
  layer_norm_type: WithBias
  pretrained: artifacts/pretrained/deraining.pth
train:
  epochs: 60
  batch_size: 4
  optimizer: adamw
  learning_rate: 0.0001
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0001
  scheduler: cosine
  min_learning_rate: 1.0e-06
  precision: bf16
  grad_clip: 1.0
  gan_weight: 0.0
  l1_weight: 1.0
  ssim_weight: 0.0
  checkpoint_every: 60
  save_periodic_checkpoints: false
  selection_metric: macro_scene_psnr_db
  selection_min_delta: 0.0
  validation_ssim: true
  expected_pretrained_sha256: 225ed9acf80b3527d7080e5182918f642a23a78ef8593ad700b7e924bd660681
