# Follow-up experiment, not a claimed improvement. Batch size is GLOBAL across GPUs.
# Initialize from the completed shared model, with a fresh optimizer/schedule.
# Every weather must retain validation PSNR and SSIM before best.pt is eligible.
run:
  name: four_weather_balanced_seed42
  seed: 42
  device: cuda
  output_dir: artifacts/restoration/four_weather_balanced_seed42
data:
  manifest: data/manifests/clean/four_weather_v2.csv
  image_size:
  - 256
  - 256
  train_mode: crop
  eval_mode: native
  random_crop: true
  random_flip: true
  num_workers: 2
  weather_probabilities:
    rain: 0.25
    fog: 0.25
    snow: 0.25
    smoke: 0.25
  samples_per_epoch: 4096
  sampling: balanced_batches
model:
  name: restormer
  dim: 48
  num_blocks:
  - 4
  - 6
  - 6
  - 8
  heads:
  - 1
  - 2
  - 4
  - 8
  num_refinement_blocks: 4
  ffn_expansion_factor: 2.66
  bias: false
  layer_norm_type: WithBias
  pretrained: artifacts/restoration/four_weather_restormer_seed42/best.pt
train:
  epochs: 20
  batch_size: 4
  optimizer: adamw
  learning_rate: 2.0e-05
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0001
  scheduler: cosine
  min_learning_rate: 1.0e-06
  precision: bf16
  grad_clip: 1.0
  gan_weight: 0.0
  l1_weight: 1.0
  checkpoint_every: 5
  selection_metric: macro_scene_psnr_db
  validation_ssim: true
  validation_guard:
    psnr_db: 0.0
    ssim: 0.0
  ssim_weight: 0.0
